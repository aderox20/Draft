name: Generate Streak Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Generate Streak Stats
        uses: muhammad-fiaz/github-readme-streak-stats@v1.0.1
        with:
          USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THEME: catppuccin-mocha
          RING: "#fab387"
          CURR_STREAK_NUM: "#f9e2af"
          FIRE: "#fab387"
          OUTPUT_PATH: github-streak-stats.svg

      - name: Push to output branch
        run: |
          cp github-streak-stats.svg /tmp/github-streak-stats.svg

          git fetch origin output || true

          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git worktree add /tmp/output origin/output
          else
            git worktree add --detach /tmp/output
            git -C /tmp/output switch --orphan output
            git -C /tmp/output rm -rf . || true
          fi

          cp /tmp/github-streak-stats.svg /tmp/output/github-streak-stats.svg

          git -C /tmp/output config user.name "github-actions[bot]"
          git -C /tmp/output config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/output add github-streak-stats.svg
          git -C /tmp/output commit -m "Update streak stats" || true
          git -C /tmp/output push origin HEAD:output

          git worktree remove /tmp/output --force
